<meta name="author" content="리프 메타 (leaf meta)">
<meta name="description" content="AX(AI Transformation) 역량을 갖추고, 그것을 검증받고, 증명하는 법을 정리한 실행 지침서. 본문 50장과 부록 4편. 마크다운을 그대로 읽는 뷰어.">
<meta property="og:type" content="book">
<meta property="og:title" content="AX 인재가 되는 법">
<meta property="og:description" content="AX 역량의 정의부터 기업의 검증 방식, 준비 로드맵, 포트폴리오, 검사와 면접 실전까지 다루는 실행 지침서.">
<meta property="og:image" content="images/cover.png">
<link rel="icon" href="images/cover.png">
<link rel="stylesheet" href="viewer/app.css">
<script>
  // 스타일시트보다 먼저 밝기와 글자 크기를 정한다. 첫 화면이 번쩍이지 않게 하려는 것이다.
  try {
    var t = JSON.parse(localStorage.getItem('bookax.theme') || 'null');
    if (!t) t = 'light';
    document.documentElement.setAttribute('data-theme', t);
    var f = JSON.parse(localStorage.getItem('bookax.fs') || 'null');
    if (f) document.documentElement.style.setProperty('--fs', f + 'px');
    var w = JSON.parse(localStorage.getItem('bookax.width') || 'null');
    var ws = { narrow: '680px', normal: '840px', wide: '1080px', full: 'none' };
    if (w && ws[w]) document.documentElement.style.setProperty('--paper-w', ws[w]);
  } catch (e) {}
</script>
</head>
